<!DOCTYPE html>
<html lang="am">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>የሶፍትዌር ኢንጂነሪንግ ፖርትፎሊዮ</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg: #0f172a;
      --surface: #1e293b;
      --surface-2: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --success: #22c55e;
      --border: rgba(148, 163, 184, 0.2);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }

    body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
    }

    header {
      border-bottom: 1px solid var(--border);
      padding: 1rem 1.5rem;
      position: sticky;
      top: 0;
      background: rgba(15, 23, 42, 0.94);
      backdrop-filter: blur(8px);
      z-index: 10;
    }

    .nav {
      max-width: 1050px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .brand { font-weight: 700; font-size: 1.15rem; color: var(--accent); text-decoration: none; }
    .nav-links { display: flex; gap: 1.25rem; align-items: center; flex-wrap: wrap; }
    .nav-links a { color: var(--text); text-decoration: none; font-size: 0.95rem; font-weight: 500; }
    .nav-links a:hover { color: var(--accent); }

    button {
      cursor: pointer;
      border: none;
      border-radius: 8px;
      padding: 0.6rem 1.1rem;
      font-weight: 600;
      font-size: 0.92rem;
      transition: 0.2s;
    }

    .btn-primary { background: var(--accent); color: #0f172a; }
    .btn-primary:hover { background: var(--accent-hover); color: #fff; }

    .container { max-width: 1050px; margin: 0 auto; padding: 2rem 1.5rem; }

    .hero { padding: 2.5rem 0 2rem; border-bottom: 1px solid var(--border); }
    .hero h1 { font-size: 2rem; margin-bottom: 0.75rem; }
    .hero p { color: var(--muted); max-width: 720px; margin-bottom: 1.25rem; }

    .filter-bar { display: flex; gap: 0.5rem; flex-wrap: wrap; margin: 1.25rem 0 1.5rem; }
    .filter-btn { background: var(--surface); color: var(--muted); border: 1px solid var(--border); }
    .filter-btn.active { background: var(--accent); color: #0f172a; border-color: var(--accent); }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
      gap: 1.25rem;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 1rem;
    }

    .badge {
      display: inline-block;
      font-size: 0.75rem;
      padding: 0.2rem 0.65rem;
      border-radius: 999px;
      background: rgba(56, 189, 248, 0.15);
      color: var(--accent);
      margin-bottom: 0.5rem;
      font-weight: 600;
    }

    .card h3 { font-size: 1.15rem; margin-bottom: 0.4rem; }
    .card p { color: var(--muted); font-size: 0.92rem; }

    .tech-list { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-top: 0.8rem; }
    .tech-tag {
      font-size: 0.75rem;
      background: var(--surface-2);
      padding: 0.2rem 0.55rem;
      border-radius: 6px;
      color: #e2e8f0;
    }

    .card-links {
      display: flex;
      gap: 1rem;
      padding-top: 0.75rem;
      border-top: 1px solid var(--border);
    }

    .card-links a { font-size: 0.85rem; color: var(--accent); text-decoration: none; font-weight: 600; }
    .card-links a:hover { text-decoration: underline; }

    section { padding: 2.5rem 0; border-bottom: 1px solid var(--border); }
    section h2 { font-size: 1.45rem; margin-bottom: 0.75rem; }

    .info-note { font-size: 0.85rem; color: var(--muted); margin-bottom: 1rem; }

    form { display: grid; gap: 0.9rem; max-width: 600px; }
    input, textarea {
      width: 100%;
      padding: 0.75rem 0.9rem;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-size: 0.95rem;
      font-family: inherit;
    }

    textarea { min-height: 115px; resize: vertical; }
    .status-msg { margin-top: 0.5rem; font-size: 0.92rem; color: var(--success); }
  </style>
</head>
<body>
  <header>
    <div class="nav">
      <a class="brand" href="#">SE Portfolio</a>
      <nav class="nav-links">
        <a href="#projects">ፕሮጀክቶች</a>
        <a href="#contact">መልዕክት ይላኩ</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <div class="hero">
      <h1>የሶፍትዌር ኢንጂነሪንግ ፕሮጀክቶች ማሳያ</h1>
      <p>
        በWeb Development፣ በAI/Machine Learning፣ በJava እና በAndroid ላይ የተሠሩ ፕሮጀክቶች ስብስብ።
        ከታች ያሉትን ምድቦች በመምረጥ ፕሮጀክቶችን ማጣራት ወይም በቀጥታ መልዕክት መላክ ይችላሉ።
      </p>
    </div>

    <section id="projects">
      <h2>የተሠሩ ፕሮጀክቶች</h2>
      <p id="dataSourceNote" class="info-note">ፕሮጀክቶች በመጫን ላይ ናቸው...</p>
      <div class="filter-bar" id="filterBar">
        <button class="filter-btn active" type="button" data-cat="All">ሁሉም</button>
        <button class="filter-btn" type="button" data-cat="Web">Web</button>
        <button class="filter-btn" type="button" data-cat="AI">AI</button>
        <button class="filter-btn" type="button" data-cat="Java">Java</button>
        <button class="filter-btn" type="button" data-cat="Android">Android</button>
      </div>
      <div class="grid" id="projectsGrid"></div>
    </section>

    <section id="contact">
      <h2>መልዕክት ይላኩልኝ</h2>
      <form id="contactForm">
        <input type="text" id="senderName" placeholder="ስምዎ" required />
        <input type="email" id="senderEmail" placeholder="ኢሜይልዎ" required />
        <textarea id="senderMessage" placeholder="መልዕክትዎን እዚህ ይጻፉ..." required></textarea>
        <button type="submit" class="btn-primary">መልዕክት ላክ</button>
        <div id="contactStatus" class="status-msg"></div>
      </form>
    </section>
  </main>

  <script>
    // --- Supabase Public Config (ብቸኛው የሕዝብ anon key ነው፤ Secret key አይገባም) ---
    const SUPABASE_URL = "https://vhjtujmfmqvveoscprlf.supabase.co/rest/v1/";
    const SUPABASE_ANON_KEY = "sb_publishable_ySU7Ki3K-9pNZnKfu5rvEg_j3iICZfT";

    // --- Telegram Bot Config (ለጊዜው የተተወ) ---
    const BOT_TOKEN = "YOUR_BOT_TOKEN_HERE";
    const CHAT_ID = "YOUR_CHAT_ID_HERE";

    const fallbackProjects = [
      {
        id: "1",
        title: "Personal Budget Tracker",
        category: "Web",
        tech: ["HTML", "CSS", "JavaScript"],
        description: "ገቢና ወጪን ለመከታተል እና የግል በጀትን በቀላሉ ለማስተዳደር የተሠራ የWeb ፕሮጀክት።",
        repo_url: "",
        demo_url: ""
      },
      {
        id: "2",
        title: "Smart Phone Recommendations System",
        category: "AI",
        tech: ["Python", "Machine Learning", "Random Forest"],
        description: "በተጠቃሚ ፍላጎት እና በዋጋ ደረጃ መሠረት ተስማሚ ስማርት ስልክ የሚመክር AI ሲስተም።",
        repo_url: "",
        demo_url: ""
      },
      {
        id: "3",
        title: "Online Assignment Submission and Evaluation System",
        category: "Java",
        tech: ["Advanced Java", "OOP", "Database"],
        description: "ተማሪዎች የቤት ስራዎችን የሚያስገቡበት እና መምህራን የሚገመግሙበት ስርዓት።",
        repo_url: "",
        demo_url: ""
      }
    ];

    let projects = [...fallbackProjects];
    let activeCategory = "All";

    function escapeHtml(str = "") {
      return String(str).replace(/[&<>"']/g, m => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[m]));
    }

    function isValidUrl(url = "") {
      try {
        const parsed = new URL(url.trim());
        return parsed.protocol === "https:" || parsed.protocol === "http:";
      } catch {
        return false;
      }
    }

    function renderProjects() {
      const grid = document.getElementById("projectsGrid");
      const filtered = activeCategory === "All"
        ? projects
        : projects.filter(p => p.category === activeCategory);

      if (filtered.length === 0) {
        grid.innerHTML = `<p style="color:var(--muted);">በዚህ ምድብ (${escapeHtml(activeCategory)}) የተመዘገበ ፕሮጀክት የለም።</p>`;
        return;
      }

      grid.innerHTML = filtered.map(p => {
        const techs = Array.isArray(p.tech) ? p.tech : [];
        const hasRepo = isValidUrl(p.repo_url);
        const hasDemo = isValidUrl(p.demo_url);

        return `
          <article class="card">
            <div>
              <span class="badge">${escapeHtml(p.category || "General")}</span>
              <h3>${escapeHtml(p.title)}</h3>
              <p>${escapeHtml(p.description)}</p>
              <div class="tech-list">
                ${techs.map(t => `<span class="tech-tag">${escapeHtml(t)}</span>`).join("")}
              </div>
            </div>
            ${(hasRepo || hasDemo) ? `
              <div class="card-links">
                ${hasRepo ? `<a href="${escapeHtml(p.repo_url.trim())}" target="_blank" rel="noopener noreferrer">GitHub</a>` : ""}
                ${hasDemo ? `<a href="${escapeHtml(p.demo_url.trim())}" target="_blank" rel="noopener noreferrer">Live Demo</a>` : ""}
              </div>
            ` : ""}
          </article>
        `;
      }).join("");
    }

    async function loadProjects() {
      const note = document.getElementById("dataSourceNote");
      const hasConfig = !SUPABASE_URL.includes("YOUR_") && !SUPABASE_ANON_KEY.includes("YOUR_") && window.supabase;

      if (!hasConfig) {
        projects = [...fallbackProjects];
        note.textContent = "የተመረጡ ፕሮጀክቶች (Supabase ሲገናኝ በቀጥታ ከዳታቤዝ ይዘምናል)።";
        renderProjects();
        return;
      }

      try {
        const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        const { data, error } = await db
          .from("projects")
          .select("*")
          .order("created_at", { ascending: false });

        if (error) throw error;

        if (data && data.length > 0) {
          projects = data;
          note.textContent = "ከSupabase Database የተጫኑ ፕሮጀክቶች።";
        } else {
          projects = [...fallbackProjects];
          note.textContent = "ዳታቤዙ ባዶ ስለሆነ መነሻ ፕሮጀክቶች እየታዩ ናቸው።";
        }
      } catch (err) {
        projects = [...fallbackProjects];
        note.textContent = "ከዳታቤዝ ጋር መገናኘት ባለመቻሉ መነሻ ፕሮጀክቶች እየታዩ ናቸው።";
      }

      renderProjects();
    }

    document.getElementById("filterBar").addEventListener("click", (e) => {
      const btn = e.target.closest(".filter-btn");
      if (!btn) return;
      document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      activeCategory = btn.dataset.cat;
      renderProjects();
    });

    document.getElementById("contactForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const statusEl = document.getElementById("contactStatus");
      const name = document.getElementById("senderName").value.trim();
      const email = document.getElementById("senderEmail").value.trim();
      const message = document.getElementById("senderMessage").value.trim();

      if (BOT_TOKEN.includes("YOUR_") || CHAT_ID.includes("YOUR_")) {
        statusEl.textContent = "መልዕክትዎ በተሳካ ሁኔታ ተቀባይነት አግኝቷል (የTelegram Bot ቅንብር ገና ስላልተሞላ በቴሌግራም አልተላከም)።";
        e.target.reset();
        return;
      }

      const text = `📩 አዲስ የፖርትፎሊዮ መልዕክት!\n\n👤 ስም: ${name}\n📧 ኢሜይል: ${email}\n💬 መልዕክት:\n${message}`;

      try {
        const res = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ chat_id: CHAT_ID, text })
        });
        const data = await res.json();
        if (data.ok) {
          statusEl.textContent = "መልዕክትዎ በተሳካ ሁኔታ ተልኳል!";
          e.target.reset();
        } else {
          statusEl.textContent = "መልዕክት መላክ አልተቻለም። እባክዎ የBot ቅንብር ያረጋግጡ።";
        }
      } catch {
        statusEl.textContent = "የኔትወርክ ችግር አጋጥሟል። እባክዎ እንደገና ይሞክሩ።";
      }
    });

    loadProjects();
  </script>
</body>
</html>
